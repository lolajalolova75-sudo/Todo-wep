<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vazifalar & Rejalar WebApp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f3f5f9;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --primary: #6366f1;
      --shadow-light: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      --shadow-soft: 0 4px 15px rgba(0,0,0,0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 16px 16px 90px 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Header Profile */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--primary);
    }

    .user-name {
      font-size: 16px;
      font-weight: 700;
    }

    /* Overview Section */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow-light);
      position: relative;
    }

    .stat-card.purple { background: #f0f0ff; }
    .stat-card.orange { background: #fff7ed; }
    .stat-card.cyan { background: #ecfeff; }
    .stat-card.green { background: #f0fdf4; }

    .stat-num {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 600;
    }

    /* Task Add Form */
    .add-form {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 20px;
      box-shadow: var(--shadow-light);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
      background: #f8fafc;
    }

    .btn-add {
      width: 100%;
      padding: 12px;
      background: #18181b;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Task Items */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .task-card.done {
      opacity: 0.6;
      text-decoration: line-through;
    }
